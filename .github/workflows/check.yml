name: Check application and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, zip
          coverage: none
      - run: find . -name '*.php' -not -path './var/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/transit.php
      - run: php tests/nearby_services.php
      - run: php tests/geo.php
      - run: php tests/timetable.php
      - run: php tests/route_cache.php
      - run: php tests/motion.php
      - run: php tests/approach.php
      - run: php tests/walking.php
      - run: php tests/geocoder.php
      - run: php tests/poi_catalog.php
      - run: php tests/street_journeys.php
      - run: php tests/arrive_by.php
      - run: php tests/google_calendar.php
      - run: php tests/transfer.php
      - run: php tests/station_metadata.php
      - run: php tests/import_progress.php
      - run: php tests/curl_progress_compat.php
      - run: php tests/transfer_rules.php
      - run: php tests/station_map.php
      - run: python3 tests/station_catalog.py
      - run: php tests/payphones.php
      - run: php tests/loader_install.php
      - run: php tests/releases.php
      - run: php tests/loader_progress.php
      - run: PHP_BINARY=php python3 tests/releases_http.py
      - run: python3 tests/release_client.py
      - run: PHP_BINARY=php python3 tests/loader_http.py
      - run: PHP_BINARY=php python3 tests/loader_cli.py
      - run: PHP_BINARY=php python3 tests/loader_progress_http.py
      - run: PHP_BINARY=php python3 tests/calendar_http.py
      - run: PHP_BINARY=php python3 tests/poi_http.py
      - run: node --check tests/browser-last-mile-uber.mjs
      - run: node --check tests/browser-arrival-colours.mjs
      - run: node --check tests/browser-trip-restore.mjs
      - run: node --check tests/browser-map-only.mjs
      - run: node --check tests/browser-nearby-bus.mjs
      - run: node --check tests/browser-nearby-onboard.mjs
      - run: node --check assets/app.js
      - run: node --check assets/planner.js
      - run: node --check assets/pois.js
      - run: node --check tests/browser-pois.mjs
      - run: node --check alerts-sw.js
      - run: node --check tests/browser-day-planner.mjs
      - run: node --check tests/browser-station-v6.mjs
      - run: node --check tests/browser-loader-progress.mjs
      - run: node --check tests/browser-station-browse.mjs
      - run: node --check tests/browser-incoming-walk.mjs
      - run: php loader.php --check

  browser-checks:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/nextstop-ui/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/nextstop-ui --no-save --no-package-lock playwright@1.62.1
      - run: node /tmp/nextstop-ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start the fixture test host
        run: |
          php -S 127.0.0.1:8080 dev-router.php > "$RUNNER_TEMP/nextstop-php.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/', timeout=1).close()
                  break
              except urllib.error.URLError:
                  time.sleep(.1)
          else:
              raise SystemExit('The local test host failed to start.')
          PY
      - run: node tests/browser-map-only.mjs
      - run: node tests/browser-nearby-onboard.mjs
      - run: node tests/browser-nearby-bus.mjs
      - run: node tests/browser-last-mile-uber.mjs
      - run: node tests/browser-arrival-colours.mjs
      - run: node tests/browser-trip-restore.mjs
      - run: node tests/browser-day-planner.mjs
