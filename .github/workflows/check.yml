name: Check application and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, curl, zip
          coverage: none
      - run: find . -name '*.php' -not -path './var/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/transit.php
      - run: php tests/geo.php
      - run: php tests/timetable.php
      - run: php tests/route_cache.php
      - run: php tests/motion.php
      - run: php tests/approach.php
      - run: php tests/walking.php
      - run: php tests/geocoder.php
      - run: php tests/street_journeys.php
      - run: php tests/transfer.php
      - run: php tests/station_metadata.php
      - run: php tests/import_progress.php
      - run: php tests/curl_progress_compat.php
      - run: php tests/transfer_rules.php
      - run: php tests/station_map.php
      - run: python3 tests/station_catalog.py
      - run: php tests/payphones.php
      - run: php tests/loader_install.php
      - run: php tests/loader_progress.php
      - run: PHP_BINARY=php python3 tests/loader_http.py
      - run: PHP_BINARY=php python3 tests/loader_cli.py
      - run: PHP_BINARY=php python3 tests/loader_progress_http.py
      - run: node --check assets/app.js
      - run: node --check tests/browser-station-v6.mjs
      - run: node --check tests/browser-loader-progress.mjs
      - run: node --check tests/browser-station-browse.mjs
      - run: node --check tests/browser-incoming-walk.mjs
      - run: php loader.php --check
